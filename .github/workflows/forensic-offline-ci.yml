name: Forensic workbench — offline synthetic tests
on:
  push:
    branches: [feature/forensic-recovery-workbench]
    paths:
      - 'forensic-workbench/**'
      - '.github/workflows/forensic-offline-ci.yml'
  pull_request:
    paths:
      - 'forensic-workbench/**'
      - '.github/workflows/forensic-offline-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests (synthetic only)
        run: python3 -m unittest discover -s forensic-workbench/tests -p 'test_*.py' -v
      - name: Compile forensic scripts
        run: python3 -m py_compile forensic-workbench/scripts/staircase_overlap.py
