name: Weekly public forensic research radar
on:
  schedule:
    - cron: '37 10 * * 1'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/forensic-research-weekly.yml'
      - 'forensic-workbench/scripts/research_radar.py'
      - 'forensic-workbench/research/sources.json'
permissions:
  contents: write
concurrency:
  group: public-forensic-research-radar
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Collect public-only GitHub project metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 forensic-workbench/scripts/research_radar.py
      - name: Commit dated source radar to this repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forensic-workbench/research/radar/*.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'chore(research): public source metadata snapshot'
          git push origin HEAD:master
