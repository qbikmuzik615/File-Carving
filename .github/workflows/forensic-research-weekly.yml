# Read-only public metadata collection; never access or commit case evidence.
name: Weekly forensic research radar - read only
on:
  schedule:
    - cron: '37 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-forensic-research-radar
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Collect public repository metadata only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 forensic-workbench/scripts/research_radar.py
      - name: Store JSON as GitHub Actions artifact; no push
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forensic-public-radar
          path: forensic-workbench/research/radar/*.json
          if-no-files-found: error
          retention-days: 30
